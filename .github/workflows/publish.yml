# 2. O cadastro e IMUTAVEL depois de criado: para mudar qualquer campo voce
#    apaga e cria outro. O limite e de 10 trusted publishers por pacote.
#
# 3. O pacote precisa existir antes. Na primeira publicacao rode um
#    "npm publish" manual com token, cadastre o trusted publisher, e so
#    depois deixe este workflow assumir.
